<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management System - Gators Learning</title>
</head>
<body>
    <div class="flex justify-end items-center relative gap-4">
        <div id="auth-buttons" class="hidden lg:flex items-center space-x-3">
            <button onclick="openModal('authModal', 'signup')" class="px-5 py-2.5 rounded-xl border-2 border-gray-100 bg-white text-sm font-bold text-rs-dark hover:border-gray-200 transition shadow-sm whitespace-nowrap">Sign up</button>
            <button onclick="openModal('authModal', 'login')" class="px-8 py-2.5 rounded-xl bg-rs-dark text-white text-sm font-bold hover:bg-black transition shadow-sm whitespace-nowrap">Login</button>
        </div>
    </div>
</body>
</html>
